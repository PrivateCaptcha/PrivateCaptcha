name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup git hooks
        run: make setup-git

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install portal NPM dependencies
        env:
          STAGE: prod
        run: make init-web

      - name: Install widget NPM dependencies
        env:
          STAGE: prod
        run: make init-widget

      - name: Build web
        env:
          STAGE: prod
        run: make build-js

      - name: Build widget script
        env:
          STAGE: prod
        run: make build-widget-script

      - name: Copy static js
        run: make copy-static-js

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.30.0'
