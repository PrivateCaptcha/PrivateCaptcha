name: Clean up old Actions caches

on:
  schedule:
    - cron: "17 3 * * */2"

  workflow_dispatch:
    inputs:
      days:
        description: "Delete caches older than this many days"
        required: true
        default: 7
        type: number

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || 7 }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff="$(date -u -d "$DAYS days ago" +%s)"

          echo "Deleting caches not accessed in the last $DAYS days"

          gh cache list \
            --repo "$GH_REPO" \
            --limit 10000 \
            --json id,lastAccessedAt \
            --jq '.[] | [.id, .lastAccessedAt] | @tsv' |
          while IFS=$'\t' read -r id last_accessed; do
            accessed="$(date -u -d "$last_accessed" +%s)"

            if (( accessed < cutoff )); then
              echo "Deleting cache $id (last accessed $last_accessed)"
              gh cache delete "$id" --repo "$GH_REPO"
            fi
          done
