name: Publish widget js package

on:
  push:
    branches:
    - main
    paths:
    - 'widget/js/**'
    - 'widget/lib/package.json'
    - '.github/workflows/widget-package.yaml'
    - '!node_modules/**'
    - '!widget/node_modules/**'
  #  tags:
  #    - '*'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Setup .npmrc file to publish to GitHub Packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version should be published
        id: check
        working-directory: ./widget/lib
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already published"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION not found, proceeding with publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: Widget release
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for OIDC
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install widget NPM dependencies
        run: npm ci
        working-directory: ./widget

      - name: Build widget library
        env:
          STAGE: prod
        run: make build-widget-library

      - name: Publish widget library
        run: make publish-widget-library EXTRA_PUBLISH_FLAGS=
