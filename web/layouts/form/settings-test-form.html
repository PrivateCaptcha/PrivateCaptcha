<div id="test-form" class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-6 sm:flex-1 sm:flex">
    <div class="sm:flex-1 sm:flex sm:items-start">
        <div class="mt-3 text-center sm:mt-0 sm:text-left sm:flex-1">
            <h3 class="text-base font-semibold leading-6 text-gray-900" id="test-modal-title">Test form</h3>
            <div class="mt-2">
                <div class="space-y-4">
                    <div>
                        <label for="test-url" class="pc-internal-form-label"> URL </label>
                        <div class="mt-2">
                            <input id="test-url" type="url" value="{{ $.Params.Form.URL }}" disabled class="w-full pc-internal-form-input-base pc-form-input-disabled" />
                        </div>
                    </div>
                    <div>
                        <label for="test-method" class="pc-internal-form-label"> Method </label>
                        <div class="mt-2">
                            <select id="test-method" disabled class="w-full pc-internal-form-select">
                                <option>POST</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="test-body" class="pc-internal-form-label"> Body </label>
                        <div class="mt-2">
                            <textarea id="test-body" name="body" rows="4" placeholder="email=test@example.com&message=hello" class="w-full pc-internal-form-input-base pc-form-input-normal"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
    <button type="submit" class="pc-internal-form-button pc-internal-form-button-primary sm:ml-4 sm:w-auto">
        Test
    </button>
    <button type="button" class="pc-internal-form-button pc-internal-form-button-secondary sm:w-auto" @click="testOpen = false">Close</button>
</div>
