{{template "form-tabs.html" (dict "Root" . "ActiveTab" "integrations")}}

<div class="mt-10">
    <div class="mx-auto max-w-2xl lg:mx-0 lg:max-w-none">
        <div class="-mt-2 -ml-2 flex flex-wrap items-baseline">
            <h3 class="mt-2 ml-2 pc-subsection-title">Form proxy snippet</h3>
            <p class="mt-1 ml-2 truncate text-sm text-pc-grey-800">use sitekey <code class="pc-chip">{{ .Params.Sitekey }}</code></p>
        </div>
        <div class="mt-6 pc-content-card overflow-hidden divide-y divide-dashed divide-pc-grey-250">
            <div class="px-4 py-5 sm:px-6">
                <div class="-ml-4 -mt-4 flex flex-wrap items-center justify-between sm:flex-nowrap">
                    <div class="ml-4 mt-4">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <img class="h-12 w-12" src="{{$.Ctx.CDN}}/portal/img/html5.svg" alt="">
                            </div>
                            <div class="ml-4">
                                <h3 class="pc-subsection-title">HTML/JS Snippet</h3>
                                <p class="text-sm text-pc-grey-800">Client-side part of the integration</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex ml-4 mt-4 items-center">
                        <a href="https://docs.privatecaptcha.com/docs/integrations/form-proxy/" target="_blank" class="pc-docs-link">Docs</a>
                    </div>
                </div>
            </div>
            <div class="bg-pc-pastel-50 px-6 py-5 sm:p-6 flex items-center sm:justify-between md:gap-6">
                <div class="grow">
                    <code class="pc-code-block">
                        <textarea id="snippet" readonly x-init="$el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px'">{{ `<!-- Add this inside the <head> of your website -->` }}
{{ `<script defer src="https:` }}{{$.Ctx.CDN}}{{ `/widget/js/privatecaptcha.js"></script>` }}

{{ `<!-- Use this instead of your existing form -->` }}
{{ `<form method="POST" action="https:`}}{{$.Ctx.API}}{{ "/form/" }}{{ .Params.Form.ExternalID }}{{ `">
  <!-- Existing form fields... -->
  <div class="private-captcha" data-sitekey="` }}{{ .Params.Sitekey }}{{ `"></div>
  <!-- <input type="submit" disabled /> -->
</form>` }}</textarea>
                    </code>
                </div>
                <div class="mt-4 sm:ml-6 sm:mt-0 sm:flex-shrink-0">
                    <button type="button" class="pc-setup-button"
                        onclick="var textarea = document.getElementById('snippet'); textarea.focus(); textarea.select(); document.execCommand('copy');">
                        Copy
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
