<div class="grid grid-cols-1 gap-x-6 gap-y-8 sm:max-w-lg sm:grid-cols-6">
    {{- if .Params.ErrorMessage -}}
    <div class="col-span-full">
        {{ template "error-message.html" .Params.ErrorMessage }}
    </div>
    {{- else if .Params.SuccessMessage -}}
    <div class="col-span-full">
        {{ template "success-message.html" .Params.SuccessMessage }}
    </div>
    {{- end -}}

    <div class="col-span-full">
        <label for="{{ .Const.Name }}" class="pc-internal-form-label" aria-label="Form name"> Name </label>
        <div class="mt-2 relative">
            <input type="text" name="{{ .Const.Name }}" placeholder="Contact Form" maxlength="255" value="{{ $.Params.Form.Name }}" {{ if not .Params.CanEdit }}disabled{{ end }} class="w-full pc-internal-form-input-base {{ if .Params.CanEdit }}pc-form-input-normal{{ else }}pc-form-input-disabled{{ end }}" required />
        </div>
    </div>

    <div class="col-span-full">
        <label for="{{ .Const.URL }}" class="pc-internal-form-label" aria-label="Form webhook URL"> URL </label>
        <div class="mt-2 relative">
            <input type="url" name="{{ .Const.URL }}" placeholder="https://hooks.example.com/contact" maxlength="2048" value="{{ $.Params.Form.URL }}" {{ if not .Params.CanEdit }}disabled{{ end }} class="w-full pc-internal-form-input-base {{ if .Params.CanEdit }}pc-form-input-normal{{ else }}pc-form-input-disabled{{ end }}" required />
        </div>
    </div>

    <div class="col-span-full">
        <div class="mt-2 flex gap-3">
            <div class="flex h-6 shrink-0 items-center">
                <div class="group grid size-4 grid-cols-1">
                    <input id="{{ .Const.Active }}" aria-describedby="{{ .Const.Active }}-description" name="{{ .Const.Active }}" type="checkbox" {{ if not .Params.CanEdit }}disabled{{ end }} {{ if $.Params.Form.Active }}checked{{ end }} class="col-start-1 row-start-1 pc-internal-form-checkbox">
                    <svg class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white group-has-[:disabled]:stroke-gray-950/25" viewBox="0 0 14 14" fill="none">
                        <path class="opacity-0 group-has-[:checked]:opacity-100" d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path class="opacity-0 group-has-[:indeterminate]:opacity-100" d="M3 7H11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>
            <div class="text-sm/6">
                <label for="{{ .Const.Active }}" class="font-medium text-gray-900">Active</label>
                <span id="{{ .Const.Active }}-description" class="text-gray-500"><span class="sr-only">Active</span>forward submissions to the configured webhook</span>
            </div>
        </div>
    </div>

    <div class="col-span-full">
        <label for="{{ .Const.RetryRequestCount }}" class="pc-internal-form-label"> Retry count </label>
        <div class="mt-2">
            <input type="number" name="{{ .Const.RetryRequestCount }}" min="0" max="1000000" placeholder="0" value="{{ $.Params.Form.RetryRequestCount }}" {{ if not .Params.CanEdit }}disabled{{ end }} class="w-full pc-internal-form-input-base {{ if .Params.CanEdit }}pc-form-input-normal{{ else }}pc-form-input-disabled{{ end }}" />
        </div>
    </div>

    <div class="col-span-full">
        <label for="{{ .Const.RequestsPerMinute }}" class="pc-internal-form-label"> Requests per minute </label>
        <div class="mt-2">
            <input type="number" name="{{ .Const.RequestsPerMinute }}" min="1" max="60" placeholder="60" value="{{ $.Params.Form.RequestsPerMinute }}" {{ if not .Params.CanEdit }}disabled{{ end }} class="w-full pc-internal-form-input-base {{ if .Params.CanEdit }}pc-form-input-normal{{ else }}pc-form-input-disabled{{ end }}" />
        </div>
    </div>
</div>

<div class="mt-8 flex">
    <button type="submit" {{ if not .Params.CanEdit }}disabled{{ end }} class="pc-internal-form-button {{ if .Params.CanEdit }}pc-internal-form-button-primary{{ else }}pc-internal-form-button-disabled{{ end }}">Save</button>
</div>
