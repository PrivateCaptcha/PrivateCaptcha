<nav class="pc-wizard-progress w-full" aria-label="Progress">
    <ol role="list">
        <li class="pc-wizard-step">
            <span aria-current="step" class="pc-wizard-step-body">
                <span class="pc-wizard-step-marker pc-wizard-step-marker-current">
                    <span>01</span>
                </span>
                <span class="pc-wizard-step-label-current">Create new form proxy</span>
            </span>
            <div aria-hidden="true" class="pc-wizard-step-separator">
                <svg viewBox="0 0 22 80" fill="none" preserveAspectRatio="none" class="size-full">
                    <path d="M0 -2L20 40L0 82" stroke="currentcolor" vector-effect="non-scaling-stroke" stroke-linejoin="round" />
                </svg>
            </div>
        </li>
        <li class="pc-wizard-step">
            <span class="group flex items-center">
                <span class="pc-wizard-step-body">
                    <span class="pc-wizard-step-marker pc-wizard-step-marker-upcoming">
                        <span>02</span>
                    </span>
                    <span class="pc-wizard-step-label-upcoming">Website integration</span>
                </span>
            </span>
        </li>
    </ol>
</nav>

<div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center pt-8">
    <form
        hx-post='{{ partsURL .Const.OrgEndpoint .Params.CurrentOrg.ID .Const.FormEndpoint .Const.NewEndpoint }}'
        hx-target="#form-wizard"
        hx-swap="innerHTML"
        hx-indicator="#spinner"
        hx-disabled-elt="input, button">
        {{template "form.html" .}}
    </form>
</div>
