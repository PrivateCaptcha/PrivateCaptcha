{{define "scripts"}}
{{template "default-scripts.html" .}}
<script>
function ruleFormData() {
    const formDataConditionValue = '{{ .Params.ConditionValue }}';
    const formDataConditionProperty = '{{ .Params.ConditionProperty }}';
    const formDataActionProperty = '{{ if .Params.ActionProperty }}{{ .Params.ActionProperty }}{{ else }}{{ .Const.ActionPropertyDifficultyLevel }}{{ end }}';
    const formDataActionValue = '{{ .Params.ActionValue }}';

    // Centralized Extensible Registry
    const conditionRegistry = {
        '{{ .Const.ConditionPropertyCountryCode }}': {
            stateField: 'selectedCountries',
            emptyValue: [],
            initialValue: (formDataConditionProperty === '{{ .Const.ConditionPropertyCountryCode }}' && formDataConditionValue) 
                ? formDataConditionValue.split(',').map(c => c.trim()).filter(c => c) 
                : [],
            getFormattedValue: (ctx) => ctx.selectedCountries.join(','),
            operators: [
                { value: '{{ .Const.OperatorIn }}', label: 'In' },
                { value: '{{ .Const.OperatorIn }}_negated', label: 'Not In' }
            ]
        },
        '{{ .Const.ConditionPropertyUserAgent }}': {
            stateField: 'conditionValueUserAgent',
            emptyValue: '',
            initialValue: formDataConditionProperty === '{{ .Const.ConditionPropertyUserAgent }}' ? formDataConditionValue : '',
            getFormattedValue: (ctx) => ctx.conditionValueUserAgent,
            tooltip: 'Text value',
            operators: [
                { value: '{{ .Const.OperatorEquals }}', label: 'Equals' },
                { value: '{{ .Const.OperatorEquals }}_negated', label: 'Not Equals' },
                { value: '{{ .Const.OperatorContains }}', label: 'Contains' },
                { value: '{{ .Const.OperatorContains }}_negated', label: 'Not Contains' },
                { value: '{{ .Const.OperatorEmpty }}', label: 'Is Empty' },
                { value: '{{ .Const.OperatorEmpty }}_negated', label: 'Is Not Empty' },
                { value: '{{ .Const.OperatorBot }}', label: 'Is Known Bot' },
                { value: '{{ .Const.OperatorBot }}_negated', label: 'Is Not Known Bot' }
            ]
        },
        '{{ .Const.ConditionPropertyIPAddress }}': {
            stateField: 'conditionValueIPAddress',
            emptyValue: '',
            initialValue: formDataConditionProperty === '{{ .Const.ConditionPropertyIPAddress }}' ? formDataConditionValue : '',
            getFormattedValue: (ctx) => ctx.conditionValueIPAddress,
            tooltip: 'Comma-separated list of IP addresses or CIDR prefixes',
            operators: [
                { value: '{{ .Const.OperatorMatches }}', label: 'Matches' },
                { value: '{{ .Const.OperatorMatches }}_negated', label: 'Not Matches' },
                { value: '{{ .Const.OperatorEmpty }}', label: 'Is Empty' },
                { value: '{{ .Const.OperatorEmpty }}_negated', label: 'Is Not Empty' }
            ]
        },
        '{{ .Const.ConditionPropertyDomain }}': {
            stateField: 'conditionValueDomain',
            emptyValue: '',
            initialValue: formDataConditionProperty === '{{ .Const.ConditionPropertyDomain }}' ? formDataConditionValue : '',
            getFormattedValue: (ctx) => ctx.conditionValueDomain,
            tooltip: 'Domain name',
            operators: [
                { value: '{{ .Const.OperatorEquals }}', label: 'Equals' },
                { value: '{{ .Const.OperatorEquals }}_negated', label: 'Not Equals' },
                { value: '{{ .Const.OperatorContains }}', label: 'Contains' },
                { value: '{{ .Const.OperatorContains }}_negated', label: 'Not Contains' },
                { value: '{{ .Const.OperatorEmpty }}', label: 'Is Empty' },
                { value: '{{ .Const.OperatorEmpty }}_negated', label: 'Is Not Empty' }
            ]
        },
        '{{ .Const.ConditionPropertyHTTPHeaderName }}': {
            stateField: 'conditionValueHTTPHeaderName',
            emptyValue: '',
            initialValue: formDataConditionProperty === '{{ .Const.ConditionPropertyHTTPHeaderName }}' ? formDataConditionValue : '',
            getFormattedValue: (ctx) => ctx.conditionValueHTTPHeaderName,
            tooltip: 'Comma-separated list of HTTP header names',
            operators: [
                { value: '{{ .Const.OperatorIn }}', label: 'Any Header Exists' },
                { value: '{{ .Const.OperatorIn }}_negated', label: 'No Header Exists' }
            ]
        }
    };

    // Child repositories can override this block to inject custom rules into `conditionRegistry`.
    {{ block "rule-conditions-registry-extension" . }}{{ end }}

    let initialOperator = '{{ if .Params.ConditionOperator }}{{ .Params.ConditionOperator }}{{ else }}{{ index .Const.StringOperators 0 }}{{ end }}';
    {{ if .Params.ConditionNegated }}
    initialOperator = initialOperator + '_negated';
    {{ end }}

    // 3. Define the Core Component 
    const componentData = {
        conditionProperty: formDataConditionProperty || '{{ .Const.ConditionPropertyUserAgent }}',
        conditionOperator: null,
        conditionNegated: {{ if .Params.ConditionNegated }}true{{ else }}false{{ end }},

        actionProperty: formDataActionProperty,
        actionValueDifficultyLevel: formDataActionProperty === '{{ .Const.ActionPropertyDifficultyLevel }}' ? (formDataActionValue || '0') : '0',
        actionValueDifficultyGrowth: formDataActionProperty === '{{ .Const.ActionPropertyDifficultyGrowth }}' ? (formDataActionValue || '0') : '0',

        // Hides inputs when operator is Empty or Bot
        get showConditionValue() {
            const baseOperator = (this.conditionOperator || '').replace('_negated', '');
            return baseOperator !== '{{ .Const.OperatorEmpty }}' && baseOperator !== '{{ .Const.OperatorBot }}';
        },

        get conditionValueTooltip() {
            const config = conditionRegistry[this.conditionProperty];
            return (config && config.tooltip) ? config.tooltip : '';
        },

        get activeConditionValue() {
            const config = conditionRegistry[this.conditionProperty] || conditionRegistry['{{ .Const.ConditionPropertyUserAgent }}'];
            return config.getFormattedValue(this);
        },

        get availableOperators() {
            const config = conditionRegistry[this.conditionProperty] || conditionRegistry['{{ .Const.ConditionPropertyUserAgent }}'];
            return config.operators;
        },

        get activeActionValue() {
            if (this.actionProperty === '{{ .Const.ActionPropertyDifficultyLevel }}') {
                return this.actionValueDifficultyLevel;
            } else if (this.actionProperty === '{{ .Const.ActionPropertyDifficultyGrowth }}') {
                return this.actionValueDifficultyGrowth;
            } else if (this.actionProperty === '{{ .Const.ActionPropertyHTTPRequest }}') {
                return '1'; // HTTP Request block is always 1 when selected
            } else if (this.actionProperty === '{{ .Const.ActionPropertyBreak }}') {
                return '0'; // Break action does not use a value
            }
            return '';
        },

        init() {
            // Apply initial operator once DOM is ready
            this.$nextTick(() => {
                this.conditionOperator = initialOperator;
            });

            // Watch for changes and automate state cleanup
            this.$watch('conditionProperty', (newVal) => {
                const config = conditionRegistry[newVal] || conditionRegistry['{{ .Const.ConditionPropertyUserAgent }}'];
                const validOperatorValues = config.operators.map(op => op.value);

                // Fallback operator if the currently selected one isn't supported by the new property
                if (!validOperatorValues.includes(this.conditionOperator) && validOperatorValues.length > 0) {
                    this.conditionOperator = validOperatorValues[0];
                }

                // Clear out inactive values so they don't persist hidden in the background
                Object.entries(conditionRegistry).forEach(([prop, regConfig]) => {
                    if (prop !== newVal) {
                        this[regConfig.stateField] = Array.isArray(regConfig.emptyValue) ? [] : '';
                    }
                });
            });

            this.$watch('actionProperty', (value) => {
                if (value === '{{ .Const.ActionPropertyDifficultyLevel }}' && this.actionValueDifficultyLevel === '') {
                    this.actionValueDifficultyLevel = '0';
                } else if (value === '{{ .Const.ActionPropertyDifficultyGrowth }}' && this.actionValueDifficultyGrowth === '') {
                    this.actionValueDifficultyGrowth = '0';
                }
            });
        },

        // Final Extension Hook for arbitrary methods
        {{ block "rule-methods-extension" . }}{{ end }}

        toggleCountry(code) {
            const index = this.selectedCountries.indexOf(code);
            if (index > -1) {
                this.selectedCountries.splice(index, 1);
            } else {
                this.selectedCountries.push(code);
            }
        },

        isCountrySelected(code) {
            return this.selectedCountries.includes(code);
        }
    };

    // Inject all the condition variables into Alpine dynamically
    Object.values(conditionRegistry).forEach(config => {
        componentData[config.stateField] = config.initialValue;
    });

    return componentData;
}
</script>
{{end}}
