{{template "org-tabs.html" (dict "Root" . "ActiveTab" "forms")}}

{{ if .Params.Forms }}
<div id="forms" class="flex-1 flex flex-col">
    {{template "forms.html" .}}
</div>
{{ else }}
<div class="flex-1 flex items-center">
    <div class="pc-empty-state">
        <h1 class="mt-6 pc-page-title">No forms</h1>
        <p class="mt-4 text-base leading-7 text-pc-grey-600">Get started by creating a new form</p>
        <div class="mt-6 flex items-center justify-center gap-x-6">
            <a
                href="{{ partsURL .Const.OrgEndpoint .Params.CurrentOrg.ID .Const.FormEndpoint .Const.NewEndpoint }}"
                class="pc-internal-form-button pc-internal-form-button-primary gap-x-2">
                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
                Add New Form
            </a>
        </div>
    </div>
</div>
{{ end }}
