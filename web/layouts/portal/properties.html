{{ if .Params.Properties }}
<div class="flex-1 mt-8">
    <div class="grid grid-cols-1 gap-8 sm:grid-cols-2">
        {{ range $property := .Params.Properties }}
        <div class="pc-property-card {{ if not $property.Enabled }}opacity-80{{ end }}">
            <div class="flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-pc-grey-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                </svg>
            </div>
            <div class="min-w-0 flex-1">
                <a href="{{ partsURL $.Const.OrgEndpoint $.Params.CurrentOrg.ID $.Const.PropertyEndpoint $property.ID }}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    <p class="flex flex-row flex-wrap items-center gap-x-2 property-name text-sm font-medium text-pc-grey-950">{{ $property.Name }}{{ if $property.AllowLocalhost }}<span class="pc-badge pc-badge-warn">Testing</span>{{ end }}<span x-cloak x-show="showSitekeys" class="pc-badge pc-badge-muted gap-x-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5 fill-pc-grey-600" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 2 2 0 012 2 1 1 0 102 0 4 4 0 00-4-4z" clip-rule="evenodd" />
                        </svg>
                        {{ printf "%.6s" $property.Sitekey }}
                    </span></p>
                    <p class="truncate text-sm text-pc-grey-600">{{ $property.Domain }}</p>
                </a>
            </div>
        </div>
        {{ end }}
    </div>
</div>
<nav aria-label="Pagination" class="flex items-center justify-between border-t border-dashed border-pc-grey-250 mt-8 pt-3">
    <div class="hidden sm:block">
        <p class="text-sm text-pc-grey-600">
        Showing
        <span class="font-medium text-pc-grey-950">{{.Params.From}}</span>
        to
        <span class="font-medium text-pc-grey-950">{{.Params.To}}</span>
        of
        <span class="font-medium text-pc-grey-950">{{.Params.Count}}</span>
        results
        </p>
    </div>
    <div class="flex flex-1 justify-between sm:justify-end">
        <button
            @click="pcTrackEvent('Previous')"
            hx-get="{{ partsURL .Const.OrgEndpoint .Params.CurrentOrg.ID .Const.PropertiesEndpoint }}"
            hx-target="#properties"
            hx-vals='{"{{$.Const.Page}}": {{if gt .Params.Page 0}}{{sub .Params.Page 1}}{{else}}0{{end}}}'
            {{if le .Params.Page 0}}disabled{{end}}
            class="pc-internal-form-button pc-internal-button-smaller {{if le .Params.Page 0}}pc-internal-form-button-disabled{{ else }}pc-internal-form-button-secondary{{ end }}">
            Previous
        </button>
        <button
            @click="pcTrackEvent('Next')"
            hx-get="{{ partsURL .Const.OrgEndpoint .Params.CurrentOrg.ID .Const.PropertiesEndpoint }}"
            hx-target="#properties"
            hx-vals='{"{{$.Const.Page}}": {{if lt .Params.To .Params.Count}}{{plus1 .Params.Page}}{{else}}{{.Params.Page}}{{end}}}'
            {{if ge .Params.To .Params.Count}}disabled{{end}}
            class="ml-3 pc-internal-form-button pc-internal-button-smaller {{if ge .Params.To .Params.Count}}pc-internal-form-button-disabled{{ else }}pc-internal-form-button-secondary{{ end }}">
            Next
        </button>
    </div>
</nav>
{{ end }}
