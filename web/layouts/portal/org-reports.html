{{template "org-tabs.html" (dict "Root" . "ActiveTab" "reports")}}

<div class="pc-chart-card overflow-hidden mt-12">
    <div class="px-4 pt-5 sm:px-6 relative z-0" x-data="orgChartComponent()">
        <div class="flex flex-wrap items-center justify-between">
            <p class="text-base font-bold text-pc-grey-950 lg:order-1">Captcha Requests</p>

            <nav class="flex items-center justify-center mt-4 space-x-1 2xl:order-2 lg:order-3 md:mt-0 lg:mt-4 sm:space-x-2 2xl:mt-0">
                <a href="#" title=""
                    @click="if (!isLoading) { period = '1y'; updateChart() }"
                    :class="[period == '1y' ? 'text-pc-green border-pc-green' : 'text-pc-grey-600 border-transparent', isLoading ? 'pointer-events-none opacity-50' : '']"
                    class="pc-period-filter">
                    12 Months
                </a>

                <a href="#" title=""
                    @click="if (!isLoading) { period = '30d'; updateChart() }"
                    :class="[period == '30d' ? 'text-pc-green border-pc-green' : 'text-pc-grey-600 border-transparent', isLoading ? 'pointer-events-none opacity-50' : '']"
                    class="pc-period-filter">
                    30 Days
                </a>

                <a href="#" title=""
                    @click="if (!isLoading) { period = '7d'; updateChart() }"
                    :class="[period == '7d' ? 'text-pc-green border-pc-green' : 'text-pc-grey-600 border-transparent', isLoading ? 'pointer-events-none opacity-50' : '']"
                    class="pc-period-filter">
                    7 Days
                </a>

                <a href="#" title=""
                    @click="if (!isLoading) { period = '24h'; updateChart() }"
                    :class="[period == '24h' ? 'text-pc-green border-pc-green' : 'text-pc-grey-600 border-transparent', isLoading ? 'pointer-events-none opacity-50' : '']"
                    class="pc-period-filter">
                    24 Hours
                </a>
            </nav>
        </div>

        <dl class="mt-5 grid grid-cols-1 gap-5">
            <div class="pc-stat-card">
                <dt class="pc-stat-label">Total Requests</dt>
                <dd class="pc-stat-value" x-text="totalRequests"></dd>
            </div>
        </dl>

        <div class="mt-6 min-h-96" id="orgChart" x-ref="chart"
            data-stats-url="{{ partsURL .Const.OrgEndpoint .Params.CurrentOrg.ID .Const.Stats }}"></div>

        <div x-cloak x-show="isLoading" class="absolute inset-0 flex justify-center items-center z-10">
            <svg id="org-spinner" class="animate-spin h-10 w-10 text-pc-grey-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </div>
</div>
