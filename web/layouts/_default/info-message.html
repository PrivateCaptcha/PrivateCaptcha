<div id="notification-message" class="pc-info-message">
    <div class="flex items-center">
        <div class="flex-shrink-0">
            <span class="pc-info-message-icon" aria-hidden="true">i</span>
        </div>
        <div class="ml-3">
            <p class="pc-info-message-text">{{ . | safeHTML }}</p>
        </div>
        <div class="ml-auto pl-3">
            <div class="-mx-1.5 -my-1.5">
                <button type="button" class="pc-info-message-dismiss"
                    onclick='document.getElementById("notification-message").remove()'>
                    <span class="sr-only">Dismiss</span>
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
