<div class="pc-info-message">
    <div class="flex items-center">
        <div class="flex-shrink-0">
            <span class="pc-info-message-icon" aria-hidden="true">i</span>
        </div>
        <div class="ml-3 flex-1 md:flex md:items-center md:justify-between md:gap-6">
            <p class="pc-info-message-text">{{ .Text | safeHTML }}</p>
            <p class="mt-3 shrink-0 md:mt-0">
                <a href="{{ .Link }}" target="_blank" rel="noopener noreferrer" class="pc-docs-link">{{ .LinkText }}</a>
            </p>
        </div>
    </div>
</div>
