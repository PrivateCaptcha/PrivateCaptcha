{{ if .Params.AuditLogs }}
<table class="relative min-w-full border-b border-dashed border-pc-grey-250">
    <thead>
        <tr class="border-b border-dashed border-pc-grey-250">
            <th scope="col" class="pc-table-head pl-4 pr-3">User</th>
            <th scope="col" class="pc-table-head px-3 lg:px-10">Action</th>
            <th scope="col" class="pc-table-head px-3 lg:px-10 w-full">Resource</th>
            <th scope="col" class="pc-table-head px-3 lg:px-10">Source</th>
            <th scope="col" class="pc-table-head px-3 lg:px-10">Time</th>
        </tr>
    </thead>
    <tbody class="pc-table-divide bg-white">
        {{ range $log := .Params.AuditLogs }}
        {{ template "auditlog-row.html" $log }}
        {{ end }}
    </tbody>
</table>
{{ else }}
<div class="flex items-center justify-center min-h-48 lg:min-h-64 xl:min-h-80">
    <div class="text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto size-12 text-pc-grey-250" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h3 class="mt-2 text-sm font-semibold text-pc-grey-950">No audit logs</h3>
        <p class="mt-1 text-sm text-pc-grey-600">Relevant audit log events will appear here.</p>
        {{ if .Params.SeeMore }}
        <div class="mt-6">
            <a href="{{ relURL .Const.AuditLogsEndpoint }}" class="pc-internal-form-button pc-internal-form-button-primary">See all Audit Logs</a>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
