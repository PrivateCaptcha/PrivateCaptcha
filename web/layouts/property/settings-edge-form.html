<form
    x-init="window.portalUnsavedChanges.registerForm($el)"
    hx-put='{{ partsURL .Const.OrgEndpoint .Params.Org.ID .Const.PropertyEndpoint .Params.Property.ID .Const.EdgeEndpoint }}'
    hx-target="this"
    hx-swap="outerHTML"
    hx-disabled-elt="input, select, button"
    data-unsaved-changes-key="property-edge-settings"
    data-unsaved-changes-scope="property-settings"
    data-unsaved-changes-initial="{{ if .Params.ErrorMessage }}dirty{{ else }}clean{{ end }}"
    class="md:col-span-2 sm:max-w-lg">
    <div class="grid grid-cols-1 gap-x-6 gap-y-8 sm:max-w-lg sm:grid-cols-6">
        {{- if .Params.ErrorMessage -}}
        <div class="col-span-full">
            {{ template "error-message.html" .Params.ErrorMessage }}
        </div>
        {{- else if .Params.SuccessMessage -}}
        <div class="col-span-full">
            {{ template "success-message.html" .Params.SuccessMessage }}
        </div>
        {{- end -}}
        <div class="col-span-full">
            <label for="{{ .Const.EdgeTokenValidityInterval }}" class="pc-internal-form-label tooltip" data-tooltip="Verified users can access protected resource for this duration.">Verified access duration</label>
            <div class="mt-2">
                <select id="{{ .Const.EdgeTokenValidityInterval }}" name="{{ .Const.EdgeTokenValidityInterval }}" {{ if not .Params.CanEdit }}disabled{{ end }} class="w-full pc-internal-form-select {{ if not .Params.CanEdit }}pc-internal-form-select-disabled{{ end }}">
                    <option value="0" {{ if eq .Params.Property.EdgeTokenValidityInterval 0 }}selected="selected"{{ end }}>Disabled (default)</option>
                    <option value="1" {{ if eq .Params.Property.EdgeTokenValidityInterval 1 }}selected="selected"{{ end }}>5 minutes</option>
                    <option value="2" {{ if eq .Params.Property.EdgeTokenValidityInterval 2 }}selected="selected"{{ end }}>10 minutes</option>
                    <option value="3" {{ if eq .Params.Property.EdgeTokenValidityInterval 3 }}selected="selected"{{ end }}>30 minutes</option>
                    <option value="4" {{ if eq .Params.Property.EdgeTokenValidityInterval 4 }}selected="selected"{{ end }}>1 hour</option>
                    <option value="5" {{ if eq .Params.Property.EdgeTokenValidityInterval 5 }}selected="selected"{{ end }}>6 hours</option>
                    <option value="6" {{ if eq .Params.Property.EdgeTokenValidityInterval 6 }}selected="selected"{{ end }}>12 hours</option>
                    <option value="7" {{ if eq .Params.Property.EdgeTokenValidityInterval 7 }}selected="selected"{{ end }}>1 day</option>
                </select>
            </div>
        </div>
        <div class="col-span-full">
            <label for="{{ .Const.EdgeWidgetStartMode }}" class="pc-internal-form-label tooltip" data-tooltip="Choose when the edge challenge starts solving.">Widget start mode</label>
            <div class="mt-2">
                <select id="{{ .Const.EdgeWidgetStartMode }}" name="{{ .Const.EdgeWidgetStartMode }}" {{ if not .Params.CanEdit }}disabled{{ end }} class="w-full pc-internal-form-select {{ if not .Params.CanEdit }}pc-internal-form-select-disabled{{ end }}">
                    <option value="{{ .Const.EdgeWidgetStartModeClick }}" {{ if ne .Params.EdgeWidgetStartMode .Const.EdgeWidgetStartModeLoad }}selected="selected"{{ end }}>On click</option>
                    <option value="{{ .Const.EdgeWidgetStartModeLoad }}" {{ if eq .Params.EdgeWidgetStartMode .Const.EdgeWidgetStartModeLoad }}selected="selected"{{ end }}>On page load</option>
                </select>
            </div>
        </div>
    </div>
    <div class="mt-8 flex">
        <button type="submit" {{ if not .Params.CanEdit }}disabled{{ end }} class="pc-internal-form-button {{ if .Params.CanEdit }}pc-internal-form-button-primary{{ else }}pc-internal-form-button-disabled{{ end }}">Save</button>
    </div>
</form>
