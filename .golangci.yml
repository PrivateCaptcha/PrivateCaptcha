version: "2"

linters:
  exclusions:
    rules:
      - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv|.*println?). is not checked"
        path: '.*\.go'
      - text: "exported (type|method|function) (.+) should have comment or be unexported"
        path: '.*\.go'
      - text: "ST1000: at least one file in a package should have a package comment"
        path: '.*\.go'
    paths:
      - cmd/loadtest/
      - cmd/paddlemock/
      - cmd/playground/
      - cmd/viewemails/
      - cmd/viewwidget/
      - cmd/viewportal/
      - cmd/formatlogs/
      - pkg/db/generated/
      - widget/node_modules

formatters:
  enable:
    - goimports
    - golines

  settings:
    golines:
      max-len: 160

run:
  build-tags:
    - enterprise
  timeout: 5m
  tests: false
