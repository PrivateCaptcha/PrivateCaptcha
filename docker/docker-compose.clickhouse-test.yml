services:
  clickhouse-test:
    image: clickhouse/clickhouse-server:26.7.4-alpine
    pull_policy: if_not_present
    healthcheck:
      test: wget --no-verbose --tries=1 -O - http://0.0.0.0:8123/?query=SELECT%201 || exit 1
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${CH_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${CH_PORT:-19000}:9000"
    volumes:
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/myconfig.xml:ro
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/myusers.xml:ro
      - clickhouse_test_data_volume:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_test_data_volume:
